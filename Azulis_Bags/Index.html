
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azulis | Home</title>
       <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f8f5f0;
            color: #111;
        }

     /* NAVIGATION BAR */

header {
    height: 90px;
    width: 100%;
    padding: 0 40px;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
}

/* LOGO ON THE LEFT */
header .logo {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    display: flex;
    align-items: center;
}

header .logo img {
    width: 75px;
    height: 75px;
    object-fit: contain;
}

/* MENU IN THE MIDDLE */
header nav {
    grid-column: 2;
    grid-row: 1;
    justify-self: center;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    white-space: nowrap;
}

header nav a {
    color: #111;
    text-decoration: none;
    font-size: 21px;
}

header nav a:hover,
header nav a.active {
    color: #9b665c;
}

/* ALL THREE ICONS ON THE RIGHT */
header .icons {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;

    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-end;
    gap: 28px;
}

header .icons a {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    color: #111;
    font-size: 21px;
    text-decoration: none;
}

header .icons a:hover {
    color: #9b665c;
    transform: translateY(-3px);
}

        /* Homepage Background */
        .hero {
            min-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            padding: 35px 8%;

            background-image: url("image/BackgroundIvory.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }

        /* Homepage Text */
        .hero-text {
            width: 100%;
            z-index: 1;
        }

        .brand-name {
            font-size: 45px;
            margin-bottom: 25px;
            text-align: left;
        }

        .hero h1 {
            font-size: clamp(55px, 6.2vw, 100px);
            line-height: 1.05;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: clamp(17px, 2vw, 27px);
            margin-bottom: 28px;
        }

        /* Shop Button */
        .button {
            display: inline-block;
            background: #111;
            color: white;
            padding: 17px 25px;
            font-size: 21px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #9b665c;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            header {
                height: auto;
                padding: 20px;
                flex-wrap: wrap;
                gap: 20px;
            }

            nav {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 18px;
            }

            nav a {
                font-size: 17px;
            }

            .hero {
                min-height: calc(100vh - 100px);
                padding: 50px 25px;
            }

            .brand-name {
                font-size: 35px;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .icons {
                gap: 12px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .hero p {
                font-size: 17px;
            }

            .button {
                font-size: 16px;
                padding: 14px 18px;
            }
        }

    </style>
</head>

<body>

   <!-- Navigation Bar -->
<header>

    <!-- 1. LOGO: LEFT SIDE -->
    <a href="index.html" class="logo">
        <img src="image/Logo.jpg" alt="Azulis Logo">
    </a>

    <!-- 2. NAVIGATION: CENTER -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="shop.html">Shop</a>
        <a href="collection.html">Collection</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- 3. THREE ICONS: RIGHT SIDE -->
    <div class="icons">

        <!-- Account Icon -->
        <a href="login.html" title="Log In">
            <i class="fa-regular fa-user"></i>
        </a>

        <!-- Search Icon -->
        <a href="collection.html" title="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>

        <!-- Shopping Cart Icon -->
        <a href="shop.html" title="Shopping Cart">
            <i class="fa-solid fa-cart-shopping"></i>
        </a>

    </div>

</header>
    <!-- Homepage Hero -->
    <main>
        <section class="hero">

            <div class="hero-text">
                <div class="brand-name">— Azulis —</div>

                <h1>Moira<br>Collection</h1>

                <p>Everyday Elegance, Beautifully Carried</p>

                <a href="collection.html" class="button">
                    Shop the Collection →
                </a>
            </div>

        </section>
    </main>

    <script>
        const links = document.querySelectorAll("nav a");

        links.forEach(function(link) {
            link.addEventListener("mouseenter", function() {
                link.style.transform = "translateY(-2px)";
            });

            link.addEventListener("mouseleave", function() {
                link.style.transform = "translateY(0)";
            });
        });
    </script>

</body>
</html>
