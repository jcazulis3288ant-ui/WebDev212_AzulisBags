
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. PAGE SETTINGS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azulis | Create Account</title>

    <!-- 2. CONNECT CSS FILE -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<!-- 3. MAIN REGISTRATION PAGE CONTAINER -->
<main class="auth-page register-page">

    <!-- 5. REGISTRATION CONTENT -->
    <section class="auth-content">

        <!-- 6. LOGO AND HOME LINK -->
        <header class="auth-header">
            <a href="index.html" class="logo">— Azulis —</a>
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </header>

        <!-- 7. REGISTRATION TITLE -->
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">
            Join Azulis for timeless everyday style.
        </p>

        <!-- 8. REGISTRATION FORM -->
        <form class="auth-form" id="registerForm">

            <!-- Full Name Field -->
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <!-- Email Field -->
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="you@example.com" required>

            <!-- Username Field -->
            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Choose a username" required>

            <!-- Password Field -->
            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password"
                   minlength="8" required>

            <!-- Confirm Password Field -->
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter your password" required>

            <!-- 9. TERMS AND PRIVACY CHECKBOX -->
            <div class="terms">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    <span>
                        I agree to the
                        <a href="#" id="termsLink">
                            Terms & Conditions
                        </a>
                        and
                        <a href="#" id="privacyLink">
                            Privacy Policy
                        </a>
                    </span>
                </label>
            </div>

            <!-- 10. CREATE ACCOUNT BUTTON -->
            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <!-- 11. LOGIN PAGE LINK -->
        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>
    </section>
</main>

<!-- 12. JAVASCRIPT REGISTRATION FUNCTION -->
<script>
    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", function(event) {
        event.preventDefault();

        // Get the user's information
        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        // Check whether passwords match
        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        // Check for an existing demo account
        if (localStorage.getItem("azulisUser")) {
            const existingUser = JSON.parse(
                localStorage.getItem("azulisUser")
            );

            if (existingUser.email === email ||
                existingUser.username === username) {

                alert("That email or username is already registered.");
                return;
            }
        }

        // Organize account information
        const user = {
            fullName: fullName,
            email: email,
            username: username,
            password: password
        };

        // Save the demo account in browser storage
        localStorage.setItem("azulisUser", JSON.stringify(user));

        // Notify the user and open the login page
        alert("Account created successfully! You can now log in.");
        window.location.href = "login.html";
    });

    // 13. TERMS AND CONDITIONS MESSAGE
    document.getElementById("termsLink").addEventListener(
        "click", function(event) {
            event.preventDefault();
            alert("Add your Azulis Terms and Conditions here.");
        }
    );

    // 14. PRIVACY POLICY MESSAGE
    document.getElementById("privacyLink").addEventListener(
        "click", function(event) {
            event.preventDefault();
            alert("Add your Azulis Privacy Policy here.");
        }
    );
</script>

</body>
</html>
