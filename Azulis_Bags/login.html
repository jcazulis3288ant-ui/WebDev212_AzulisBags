
<!DOCTYPE html>
<html lang="en">
<head>
    <!--  PAGE SETTINGS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azulis | Log In</title>

    <!-- CONNECT CSS FILE -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<!-- MAIN LOGIN PAGE CONTAINER -->
<main class="auth-page">


    <!--  LOGIN CONTENT -->
    <section class="auth-content">

        <!-- 6. LOGO AND HOME LINK -->
        <header class="auth-header">
            <a href="index.html" class="logo">— Azulis —</a>
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </header>

        <!-- LOGIN TITLE -->
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
            Sign in to discover your everyday elegance.
        </p>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm">

            <!-- Email Field -->
            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="you@example.com" required>

            <!-- Password Field -->
            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <!-- Remember Me and Forgot Password -->
            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">
                    Forgot password?
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="auth-button">
                Log In
            </button>
        </form>

        <!--  GOOGLE SIGN-IN SECTION -->
        <div class="divider-text">or continue with</div>

        <a href="#" class="google-button" id="googleLogin">
            🌐 &nbsp; Continue with Google
        </a>

        <!--  REGISTER PAGE LINK -->
        <p class="auth-footer">
            New to Azulis?
            <a href="register.html">Create an account</a>
        </p>
    </section>
</main>

<!-- JAVASCRIPT LOGIN FUNCTION -->
<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // Get the registered account from browser storage
        const savedUser = JSON.parse(
            localStorage.getItem("azulisUser") || "null"
        );

        // Check whether an account exists
        if (!savedUser) {
            alert("Please create an account first.");
            return;
        }

        // Compare the entered login details
        if (email === savedUser.email &&
            password === savedUser.password) {

            alert("Welcome back to Azulis!");
            window.location.href = "index.html";

        } else {
            alert("Incorrect email or password.");
        }
    });

    // 12. SHOW OR HIDE PASSWORD
    document.getElementById("password").insertAdjacentHTML(
        "afterend",
        '<button type="button" id="togglePassword" ' +
        'style="margin-top:8px; background:none; border:none; ' +
        'cursor:pointer; font-family:Georgia;">Show password</button>'
    );

    document.getElementById("togglePassword").addEventListener(
        "click", function() {

            const password = document.getElementById("password");
            const showing = password.type === "text";

            password.type = showing ? "password" : "text";

            this.textContent = showing
                ? "Show password"
                : "Hide password";
        }
    );

    // 13. FORGOT PASSWORD MESSAGE
    document.getElementById("forgotPassword").addEventListener(
        "click", function(event) {
            event.preventDefault();
            alert("Please contact Azulis support to reset your password.");
        }
    );

    // 14. GOOGLE SIGN-IN DEMONSTRATION
    document.getElementById("googleLogin").addEventListener(
        "click", function(event) {
            event.preventDefault();
            alert("Google sign-in needs Google authentication setup.");
        }
    );
</script>

</body>
</html>
